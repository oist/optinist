# Packages in conda env for [suite2p]
dependencies:
  - python=3.9
  - pip
  - pyqt=5.15.*
  - pyqt5-sip=12.11.*
  - pip:
    - numpy==1.23.*
    - pyqtgraph==0.12.*
    - pandas==1.5.*
    - suite2p==0.10.3
    - tifffile==2022.3.*
    # cryptography>=49 has no macOS x86_64 wheels; its source build under Rosetta can be broken
    - 'cryptography<49; sys_platform == "darwin" and platform_machine == "x86_64"'
